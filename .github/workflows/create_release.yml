name: Release
on:
  push:
    tags:
      - "*"
jobs:
  build-bundle:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create cache folder
        run: mkdir -p data/cache/
      # SHA pin: act 0.2.87 cannot resolve some v4-era tags via go-git.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.5.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"
      - name: Check if secrets exists
        id: check_secret
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Grant Permissions to gradlew
        run: chmod +x gradlew
      - name: Get cache version
        run: echo "cache_version=$(./gradlew -q printCacheVersion | tail -n1 | xargs)" >> $GITHUB_ENV
      - name: Get build version
        run: echo "build_version=$(./gradlew -q printVersion | tail -n1 | xargs)" >> $GITHUB_ENV
      - name: Cache game files
        if: steps.check_secret.outputs.exists == 'true'
        id: cache-files
        uses: actions/cache@v4
        with:
          key: cache-${{ env.cache_version }}-${{ hashFiles('data/cache/main_file_cache.idx255') }}
          path: data/cache/
          enableCrossOsArchive: 'true'
          restore-keys:
            cache-${{ env.cache_version }}
            cache-
      - if: steps.check_secret.outputs.exists == 'true' && steps.cache-files.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-2
        run: aws s3 cp --recursive s3://void-rsps/caches/${{ env.cache_version }}/ data/cache/
      - name: Run distribution assembly
        run: ./gradlew assembleBundleDist
      - name: Upload distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ env.build_version }}
        run: gh release create -d "$REF_NAME" "./game/build/distributions/void-$BUILD_VERSION.zip"
      - name: Build and push multi-arch image with jib + jlink
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew :game:jib -PincludeDb \
            -Pjib.image=greghib/void \
            -Pjib.tag="$REF_NAME" \
            --no-configuration-cache
